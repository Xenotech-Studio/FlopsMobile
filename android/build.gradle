buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// @isudaji/react-native-install-apk 使用 compileSdkVersion 23，需强制与根项目一致；已评估则直接改，否则 afterEvaluate
project.subprojects(new groovy.lang.Closure(this) {
    Object doCall(Object sub) {
        if (!sub.name.contains("install-apk")) return null
        def applySdk = {
            if (sub.plugins.hasPlugin("com.android.library")) {
                sub.android.compileSdkVersion rootProject.ext.compileSdkVersion
                sub.android.buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
        if (sub.state.executed) applySdk() else sub.afterEvaluate(applySdk)
        return null
    }
})
